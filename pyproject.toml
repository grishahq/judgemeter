[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "judgemeter"
version = "0.1.0"
description = "Offline consistency analysis for repeated fixed-answer LLM judge evaluations; attributed AutoEvals fork"
readme = "README.md"
requires-python = ">=3.10.0"
authors = [{ name = "JudgeMeter contributors" }]
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
]
dependencies = [
  "chevron",
  "jsonschema",
  "polyleven",
  "pyyaml",
]

[project.urls]
Homepage = "https://github.com/grishahq/judgemeter"
"Bug Tracker" = "https://github.com/grishahq/judgemeter/issues"

[project.optional-dependencies]
dev = [
  # Formatting and linting
  "black==22.6.0",
  "flake8",
  "flake8-isort",
  "isort==5.12.0",
  "pre-commit",

  # Build and release tooling
  "build",
  "twine",

  # Development and test tooling
  "braintrust",
  "ipython",
  "openai",
  "pytest",
  "pytest-asyncio",
  "pytest-mock",
  "respx",
]
doc = ["pydoc-markdown"]
scipy = ["numpy", "scipy"]
litellm = ["litellm>=1.60,<1.85"]
all = ["judgemeter[scipy]"]

[tool.setuptools]
package-dir = { "" = "py" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["py"]

[project.scripts]
judgemeter = "judgemeter.__main__:main"

[tool.black]
line-length = 119

[tool.ruff]
line-length = 119
lint.select = ["I001"]
